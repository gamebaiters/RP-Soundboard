name: Release (Win + Linux + macOS)

# Triggered when a vX.Y.Z tag is pushed. Builds the plugin on a Windows,
# Linux and macOS runner in parallel, fuses the three platform binaries
# into a single multi-platform .ts3_plugin, and creates the GitHub release.
#
# To cut a release from any machine (Windows included):
#   git tag v1.0.103
#   git push origin v1.0.103
# That is the only manual step. The workflow does everything else.
#
# manual_dispatch lets you trigger the same flow without a tag for testing
# (it builds everything but does not create the release).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: '5.15.2'

jobs:

  # ---------------- WINDOWS x64 ----------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # MSYS2 supplies the make/nasm/perl tools FFmpeg's configure needs
      # while still letting the MSVC env (cl.exe + lib.exe) come through
      # via path-type:inherit. The combination produces real .lib STATIC
      # archives that link cleanly into the MSVC plugin DLL - no runtime
      # FFmpeg DLL dependencies, single self-contained binary.
      - name: Setup MSYS2 (host toolchain for FFmpeg configure)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make nasm perl pkg-config diffutils
          path-type: inherit
          update: false

      - name: Cache static FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-static
          key: ffmpeg-static-msvc-x64-n6.1.1-v2

      - name: Build static FFmpeg with MSVC toolchain
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -e
          git clone --depth 1 --branch n6.1.1 https://git.ffmpeg.org/ffmpeg.git ffmpeg-src
          cd ffmpeg-src
          # --toolchain=msvc tells configure to use cl.exe + lib.exe so the
          # produced archives are MSVC-compatible static .lib files.
          ./configure \
              --toolchain=msvc \
              --prefix=$(pwd)/../ffmpeg-static \
              --enable-static --disable-shared \
              --disable-programs --disable-doc --disable-debug \
              --disable-everything \
              --enable-decoder=mp3,mp3float,aac,vorbis,opus,flac,pcm_s16le,pcm_f32le,pcm_s24le,pcm_s32le,wmav2,wmapro,ac3,eac3 \
              --enable-demuxer=mp3,wav,ogg,flac,mov,matroska,avi,aac,asf,flv \
              --enable-protocol=file \
              --enable-parser=mpegaudio,vorbis,opus,flac,aac,ac3 \
              --enable-filter=aresample,aformat,aeval,anull,silenceremove
          make -j$(nproc) V=0
          make install
          ls -la ../ffmpeg-static/lib

      - name: Set up include + lib hints
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "ffmpeg/lib_win_x64" -Force | Out-Null
          New-Item -ItemType Directory -Path "ffmpeg/include"     -Force | Out-Null
          Copy-Item ffmpeg-static/lib/*.lib    -Destination "ffmpeg/lib_win_x64/" -Force
          Copy-Item ffmpeg-static/lib/*.a      -Destination "ffmpeg/lib_win_x64/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse ffmpeg-static/include/* -Destination "ffmpeg/include/" -Force
          "FFmpeg static archives:"
          Get-ChildItem ffmpeg/lib_win_x64 | Format-Table Name,Length

      - name: Configure CMake (FFMPEG_STATIC=ON)
        shell: pwsh
        run: |
          cmake -G "NMake Makefiles" -B build `
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
              -DCMAKE_INSTALL_PREFIX=install `
              -DFFMPEG_STATIC=ON `
              -DffmpegLibHint="$(Resolve-Path ffmpeg/lib_win_x64)" `
              -DffmpegIncludeDir="$(Resolve-Path ffmpeg/include)"

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Stage Windows artifact layout (single self-contained DLL)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage/plugins/rp_soundboard -Force | Out-Null
          Copy-Item build/release/rp_soundboard_fx_win64.dll stage/plugins/
          if (Test-Path deploy/plugins/rp_soundboard) {
              Copy-Item -Recurse deploy/plugins/rp_soundboard/* stage/plugins/rp_soundboard/
          }
          "DLL size (must be > 1 MB - confirms FFmpeg statically linked):"
          (Get-Item stage/plugins/rp_soundboard_fx_win64.dll).Length
          Get-ChildItem stage/plugins -Recurse | Format-Table FullName,Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: stage/plugins/
          if-no-files-found: error


  # ---------------- LINUX x86_64 ----------------
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential cmake pkg-config python3 zip \
              qtbase5-dev qttools5-dev qttools5-dev-tools \
              libqt5network5 libqt5gui5 libqt5widgets5 libqt5core5a \
              libavcodec-dev libavformat-dev libavfilter-dev \
              libavutil-dev libswresample-dev

      - name: Configure CMake
        run: |
          cmake -B build \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_INSTALL_PREFIX=install \
              -DffmpegLibHint=/usr/lib/x86_64-linux-gnu \
              -DffmpegIncludeDir=/usr/include

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Stage Linux artifact layout
        run: |
          mkdir -p stage/plugins/rp_soundboard
          # the build target output name has the _linux_amd64.so suffix per CMakeLists
          cp build/librp_soundboard_fx_linux_amd64.so stage/plugins/ \
            || cp build/rp_soundboard_fx_linux_amd64.so stage/plugins/ \
            || cp build/release/librp_soundboard_fx_linux_amd64.so stage/plugins/ \
            || cp build/release/rp_soundboard_fx_linux_amd64.so stage/plugins/
          if [ -d deploy/plugins/rp_soundboard ]; then
              cp -r deploy/plugins/rp_soundboard/* stage/plugins/rp_soundboard/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: stage/plugins/
          if-no-files-found: error


  # ---------------- macOS x86_64 ----------------
  build-macos:
    # Self-hosted runner on a personal Apple Silicon Mac.
    # TeamSpeak 3 on macOS is x86_64-only, so we link against x86_64
    # Qt5 / FFmpeg coming from an Intel Homebrew tree at /usr/local.
    #
    # ONE-TIME SETUP REQUIRED ON THE MAC (cannot be done from CI - needs sudo):
    #   1. sudo softwareupdate --install-rosetta --agree-to-license
    #   2. xcode-select --install      # if not already
    #   3. arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    #   4. arch -x86_64 /usr/local/bin/brew install qt@5 ffmpeg
    #
    # After that the runner user owns /usr/local/Homebrew and the steps
    # below run without sudo - 'brew update' and 'brew upgrade' on an
    # already-bootstrapped tree never escalate privileges.
    runs-on: self-hosted
    env:
      INTEL_BREW: /usr/local/bin/brew
    steps:
      - uses: actions/checkout@v4

      - name: Verify Rosetta + Intel Homebrew prerequisites
        run: |
          # Rosetta - tests by running uname under x86_64 emulation
          if ! arch -x86_64 /usr/bin/uname -m >/dev/null 2>&1; then
              cat <<'EOF' >&2
          ERROR: Rosetta 2 is not installed on this runner.
          Run ONCE on the Mac (interactive sudo, can't run from CI):
              sudo softwareupdate --install-rosetta --agree-to-license
          EOF
              exit 1
          fi
          arch -x86_64 /usr/bin/uname -m
          # Intel Homebrew
          if [ ! -x "$INTEL_BREW" ]; then
              cat <<'EOF' >&2
          ERROR: Intel Homebrew is not installed at /usr/local.
          Run ONCE on the Mac (interactive sudo, can't run from CI):
              arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
              arch -x86_64 /usr/local/bin/brew install qt@5 ffmpeg
          EOF
              exit 1
          fi
          arch -x86_64 "$INTEL_BREW" --version

      - name: Update Qt5 + FFmpeg via Intel Homebrew (no sudo)
        run: |
          # 'brew update' and installing/upgrading formulae never need
          # sudo on a Homebrew tree the runner user already owns.
          arch -x86_64 "$INTEL_BREW" update || true
          arch -x86_64 "$INTEL_BREW" install qt@5 ffmpeg 2>&1 | tail -20 || true
          arch -x86_64 "$INTEL_BREW" upgrade qt@5 ffmpeg 2>&1 | tail -20 || true
          echo "/usr/local/opt/qt@5/bin" >> "$GITHUB_PATH"

      - name: Sanity-check arch of dependencies
        run: |
          file /usr/local/opt/qt@5/lib/QtCore.framework/QtCore | tee /tmp/arch.log
          file /usr/local/opt/ffmpeg/lib/libavcodec.dylib       | tee -a /tmp/arch.log
          if grep -E "arm64" /tmp/arch.log; then
              echo "Dependencies are arm64 - link will fail. Aborting." >&2
              exit 1
          fi

      - name: Configure CMake (x86_64)
        run: |
          cmake -B build \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_INSTALL_PREFIX=install \
              -DCMAKE_OSX_ARCHITECTURES=x86_64 \
              -DCMAKE_PREFIX_PATH=/usr/local/opt/qt@5 \
              -DffmpegLibHint=/usr/local/opt/ffmpeg/lib \
              -DffmpegIncludeDir=/usr/local/opt/ffmpeg/include

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Stage macOS artifact layout (recursive bundle + rpath rewrites)
        run: |
          set -e
          mkdir -p stage/plugins/rp_soundboard
          DYLIB_SRC="$(find build -name 'librp_soundboard_fx*_mac.dylib' | head -1)"
          if [ -z "$DYLIB_SRC" ]; then
              echo "dylib not found"; ls -la build; exit 1
          fi
          cp "$DYLIB_SRC" stage/plugins/librp_soundboard_fx_mac.dylib
          PLUGIN="stage/plugins/librp_soundboard_fx_mac.dylib"

          # IMPORTANT: install_name_tool refuses to modify code-signed
          # binaries silently fails with --force-style invocations. cp
          # from Homebrew preserves the source ad-hoc signature, so we
          # MUST strip the signature on every staged dylib before any
          # install_name_tool call. We re-codesign at the end.
          strip_sig() {
              codesign --remove-signature "$1" 2>/dev/null || true
              # Defensive: also strip xattrs that block tools
              xattr -cr "$1" 2>/dev/null || true
              chmod 644 "$1" 2>/dev/null || true
          }

          # First strip the plugin dylib itself
          strip_sig "$PLUGIN"

          # Recursive bundler: copy /usr/local + /opt/homebrew deps next
          # to the plugin and rewrite refs to @loader_path. Skips Qt
          # (resolved via TS3.app rpath), system libs, and already-
          # relative paths.
          bundle_deps() {
              local target="$1"
              local dep base real
              # Read deps into array first (avoid subshell pitfalls of
              # piping into while-read)
              local -a deps=()
              while IFS= read -r line; do
                  deps+=("$line")
              done < <(otool -L "$target" | awk 'NR>1 {print $1}')

              for dep in "${deps[@]}"; do
                  [ -z "$dep" ] && continue
                  case "$dep" in
                      *Qt*.framework*)                                 continue ;;
                      @loader_path/*|@rpath/*|@executable_path/*)      continue ;;
                      /usr/lib/*|/System/*)                            continue ;;
                  esac
                  case "$dep" in
                      /usr/local/*|/opt/homebrew/*)
                          base="$(basename "$dep")"
                          if [ ! -e "stage/plugins/${base}" ]; then
                              real="$(/usr/bin/perl -MCwd -e 'print Cwd::abs_path(shift)' "$dep" 2>/dev/null || echo "$dep")"
                              if [ -e "$real" ] && [ -f "$real" ]; then
                                  cp "$real" "stage/plugins/${base}"
                                  strip_sig "stage/plugins/${base}"
                                  install_name_tool -id "@loader_path/${base}" "stage/plugins/${base}"
                                  bundle_deps "stage/plugins/${base}"
                              fi
                          fi
                          # NOTE: target may be code-signed at this point
                          # if it was just newly cp'd by an outer call.
                          # strip_sig was already called by the outer
                          # invocation, but we strip again defensively
                          # to catch the case where the OS re-applied
                          # an ad-hoc signature on cp.
                          codesign --remove-signature "$target" 2>/dev/null || true
                          install_name_tool -change "$dep" "@loader_path/${base}" "$target"
                          ;;
                  esac
              done
          }

          bundle_deps "$PLUGIN"

          # Final sweep pass: walk every staged dylib + the plugin and
          # rewrite ANY remaining /usr/local or /opt/homebrew dep to
          # @loader_path. This catches anything bundle_deps may have
          # missed (e.g. install_name_tool failed silently on a still-
          # signed binary, or a dep got copied later by a sibling).
          # Iterates until no rewrites happen for a full pass.
          final_sweep() {
              local pass changed target dep base
              for pass in 1 2 3; do
                  changed=0
                  for target in "$PLUGIN" stage/plugins/*.dylib; do
                      [ -e "$target" ] || continue
                      codesign --remove-signature "$target" 2>/dev/null || true
                      while IFS= read -r dep; do
                          [ -z "$dep" ] && continue
                          case "$dep" in
                              *Qt*.framework*) continue ;;
                              @loader_path/*|@rpath/*|@executable_path/*) continue ;;
                              /usr/lib/*|/System/*) continue ;;
                          esac
                          case "$dep" in
                              /usr/local/*|/opt/homebrew/*)
                                  base="$(basename "$dep")"
                                  if [ -e "stage/plugins/${base}" ]; then
                                      if install_name_tool -change "$dep" "@loader_path/${base}" "$target" 2>/dev/null; then
                                          changed=1
                                      fi
                                  fi
                                  ;;
                          esac
                      done < <(otool -L "$target" | awk 'NR>1 {print $1}')
                  done
                  [ "$changed" = "0" ] && break
              done
          }

          final_sweep

          # Rewrite Qt framework paths in plugin to @rpath form. TS3.app
          # on macOS ships QtCore.framework / QtGui.framework / etc. in
          # its Frameworks dir and adds that dir to LC_RPATH on the host
          # binary, so plugins loaded by TS3 inherit the rpath and find
          # @rpath/QtCore.framework/Versions/5/QtCore at runtime.
          codesign --remove-signature "$PLUGIN" 2>/dev/null || true
          while IFS= read -r qtdep; do
              [ -z "$qtdep" ] && continue
              rel="$(echo "$qtdep" | grep -oE 'Qt[A-Za-z]+\.framework/.+' || true)"
              [ -n "$rel" ] && install_name_tool -change "$qtdep" "@rpath/${rel}" "$PLUGIN" || true
          done < <(otool -L "$PLUGIN" | awk 'NR>1 {print $1}' | grep -E 'Qt[A-Za-z]+\.framework' || true)

          # Re-sign every binary ad-hoc.
          for f in "$PLUGIN" stage/plugins/*.dylib; do
              [ -e "$f" ] || continue
              codesign --force -s - "$f" 2>/dev/null || true
          done

          echo "--- Final dependency list ---"
          for f in "$PLUGIN" stage/plugins/*.dylib; do
              [ -e "$f" ] || continue
              echo "=== $f ==="
              otool -L "$f"
          done

          # Sanity check: no /usr/local or /opt/homebrew refs left
          # except inside Qt framework paths.
          BAD="$(otool -L "$PLUGIN" stage/plugins/*.dylib 2>/dev/null | grep -E '(/usr/local/|/opt/homebrew/)' | grep -v 'Qt[A-Za-z]+\.framework' || true)"
          if [ -n "$BAD" ]; then
              echo "ERROR: bundled binaries still reference Homebrew absolute paths:" >&2
              echo "$BAD" >&2
              exit 1
          fi

          if [ -d deploy/plugins/rp_soundboard ]; then
              cp -r deploy/plugins/rp_soundboard/* stage/plugins/rp_soundboard/
          fi

          echo "--- Bundled binaries ---"
          ls -la stage/plugins/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: stage/plugins/
          if-no-files-found: error

      # Build Install_Soundboard_macOS.zip - the AppleScript .app bundle
      # users double-click to install on macOS (TS3 .app on macOS doesn't
      # have a working .ts3_plugin file association, so we ship our own
      # installer wrapped in an .app).
      - name: Build macOS-only .ts3_plugin (input for the .app installer)
        run: |
          PKG_ROOT="$(mktemp -d)"
          mkdir -p "$PKG_ROOT/plugins/rp_soundboard"
          # render package.ini with version from tag (or snapshot from sha)
          TAG="${GITHUB_REF##refs/tags/}"
          VERSION="${TAG#v}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
              VERSION="0.0.0-$(date +%Y%m%d%H%M)-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          sed "s/@version@/$VERSION/" src/package.ini.in > "$PKG_ROOT/package.ini"
          cp -R stage/plugins/. "$PKG_ROOT/plugins/"
          MAC_PKG="$(pwd)/rp_soundboard_fx_${VERSION}_macos_x86_64.ts3_plugin"
          rm -f "$MAC_PKG"
          (cd "$PKG_ROOT" && zip -r "$MAC_PKG" . -x "**/.DS_Store")
          ls -la "$MAC_PKG"
          echo "MAC_PKG=$MAC_PKG" >> "$GITHUB_ENV"

      - name: Build Install Soundboard.app via osacompile
        run: |
          APP_NAME="Install Soundboard"
          APP_BUILD_DIR="$(pwd)/macinstaller"
          rm -rf "$APP_BUILD_DIR"
          mkdir -p "$APP_BUILD_DIR"
          cd "$APP_BUILD_DIR"

          # AppleScript - shows a dialog and runs the embedded shell
          # script with the embedded .ts3_plugin path.
          cat > installer.applescript <<'AS'
          on run
              try
                  set appPath to POSIX path of (path to me)
                  set scriptPath to appPath & "Contents/Resources/install_embedded_macos.sh"
                  set pluginPath to appPath & "Contents/Resources/rp_soundboard_fx.ts3_plugin"
                  display dialog "Install GameBaiters Soundboard for TeamSpeak 3?" buttons {"Cancel", "Install"} default button "Install" with icon note with title "GameBaiters Soundboard Installer"
                  if button returned of result is not "Install" then return
                  set installedTo to do shell script "/bin/bash " & quoted form of scriptPath & " " & quoted form of pluginPath
                  display dialog "Installation complete." & return & return & "Plugin folder: " & installedTo & return & return & "Reopen TeamSpeak 3 and enable the plugin from Settings if it is not already active." buttons {"OK"} default button "OK" with icon note with title "GameBaiters Soundboard Installer"
              on error errMsg number errNum
                  if errNum is -128 then return
                  display dialog "Installation failed:" & return & return & errMsg buttons {"OK"} default button "OK" with icon stop with title "GameBaiters Soundboard Installer"
              end try
          end run
          AS

          # Compile to .app bundle
          osacompile -o "${APP_NAME}.app" installer.applescript

          # Inject the .ts3_plugin + install script into Resources/
          cp "$MAC_PKG"                              "${APP_NAME}.app/Contents/Resources/rp_soundboard_fx.ts3_plugin"
          cp ../dist/install_embedded_macos.sh       "${APP_NAME}.app/Contents/Resources/"
          chmod +x                                    "${APP_NAME}.app/Contents/Resources/install_embedded_macos.sh"

          # Ad-hoc sign so Gatekeeper recognizes the bundle as valid even
          # without a paid Apple Developer cert.
          codesign --force --deep -s - "${APP_NAME}.app"
          codesign --verify --deep --verbose=2 "${APP_NAME}.app" || true

          # Zip
          zip -r ../Install_Soundboard_macOS.zip "${APP_NAME}.app"
          ls -la ../Install_Soundboard_macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: Install_Soundboard_macOS.zip
          if-no-files-found: error


  # ---------------- COMBINE + RELEASE ----------------
  package-and-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      # softprops/action-gh-release uses GITHUB_TOKEN; default-token has
      # no write access on forks. Granting contents:write lets the job
      # create / update the release + upload assets via the API.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: combined/plugins/

      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: combined/plugins/

      - uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: combined/plugins/

      - uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: ./

      - name: Resolve version + write package.ini
        id: ver
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          VERSION="${TAG#v}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
              # workflow_dispatch path - synthesize a snapshot version
              VERSION="0.0.0-$(date +%Y%m%d%H%M)-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # render package.ini.in with the resolved version
          sed "s/@version@/$VERSION/" src/package.ini.in > combined/package.ini
          echo "--- package.ini ---"
          cat combined/package.ini

      - name: Build multi-platform .ts3_plugin
        run: |
          cd combined
          PKG="../rp_soundboard_fx_${{ steps.ver.outputs.VERSION }}.ts3_plugin"
          rm -f "$PKG"
          zip -r "$PKG" . -x "**/.DS_Store"
          ls -la "$PKG"
          echo "--- contents ---"
          unzip -l "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: ts3plugin
          path: rp_soundboard_fx_*.ts3_plugin

      - name: Read release notes file
        id: notes
        run: |
          if [ -f release-notes.txt ]; then
              cp release-notes.txt /tmp/notes.txt
          else
              echo "Release ${{ steps.ver.outputs.VERSION }}" > /tmp/notes.txt
          fi
          echo "NOTES_PATH=/tmp/notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "GameBaiters Soundboard ${{ github.ref_name }}"
          body_path: ${{ steps.notes.outputs.NOTES_PATH }}
          files: |
            rp_soundboard_fx_*.ts3_plugin
            Install_Soundboard_macOS.zip
            dist/uninstall_soundboard.bat
            dist/uninstall_soundboard.sh
            dist/uninstall_soundboard_macos.sh
          fail_on_unmatched_files: false
